name: Switch to verified map entity links
on:
  push:
    paths:
      - '.github/workflows/switch-map-entity-links.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified entity links
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Navigation registry: coordinates remain metadata; map buttons use provider-specific verified place URLs only.
          nav = """window.PLACE_NAV={
            'ust-orda-25':{lat:52.44325,lon:104.40013,label:'Свято-Троицкий храм в селе Куда',source:'source coordinates'},
            'tazh-1':{lat:52.791616,lon:106.527685,label:'Гора Ёрд (Ехе-Ёрд)',source:'official route passport'},
            'tazh-3':{lat:52.925877,lon:106.759206,label:'Тажеранская обзорная площадка',source:'official route passport'},
            'tazh-4':{lat:52.951578,lon:106.749014,label:'Тажеранские скалы-останцы',source:'official route passport'},
            'tazh-5':{lat:52.719069,lon:106.533435,label:'Залив Бирхин',source:'official route passport'},
            'arshan-2':{lat:51.915617,lon:102.429026,label:'Будда Медицины',googleUrl:'https://www.google.com/maps/search/?api=1&query=%D0%91%D1%83%D0%B4%D0%B4%D0%B0%20%D0%9C%D0%B5%D0%B4%D0%B8%D1%86%D0%B8%D0%BD%D1%8B%2C%20%D0%90%D1%80%D1%88%D0%B0%D0%BD',yandexUrl:'https://yandex.ru/maps/org/budda_meditsiny/152183331065/',source:'verified map entity + 2026 guide'},
            'arshan-9':{lat:51.91541,lon:102.42826,label:'Алтарь Сагаан Убгэн',yandexUrl:'https://yandex.ru/maps/org/sagaan_ubgen/7389356205/',source:'verified Yandex map entity'},
            'slud-1':{lat:51.658786,lon:103.724168,label:'Мраморный вокзал Слюдянки',yandexUrl:'https://yandex.ru/maps/org/railway_station/199004009873/',source:'verified Yandex railway-station entity'},
            'slud-10':{lat:51.73206,lon:103.711082,label:'Смотровая на Култукском серпантине',yandexUrl:'https://yandex.ru/maps/org/smotrovaya_ploshchadka/45168199333/',source:'verified Yandex observation-deck entity'},
            'slud-19':{lat:51.640135,lon:103.697184,label:'Старт тропы «Иду на пик»',source:'official tourism portal'}
          };
          """
          Path('place-nav.js').write_text(nav)

          # 2) UI: never synthesize map URLs from coordinates. Render only verified provider URLs present in registry.
          p=Path('place-app.js')
          s=p.read_text()
          old="function mapLinksHTML(p){const n=window.PLACE_NAV&&window.PLACE_NAV[p.i];if(!n||!n.verified||!Number.isFinite(n.lat)||!Number.isFinite(n.lon))return'';const g=encodeURIComponent(n.lat+','+n.lon),y=encodeURIComponent(n.lat+','+n.lon);return`<div class=\"maplinks\"><a class=\"btn\" href=\"https://www.google.com/maps/search/?api=1&query=${g}\" target=\"_blank\" rel=\"noopener\">📍 Google Maps</a><a class=\"btn\" href=\"https://yandex.ru/maps/?text=${y}\" target=\"_blank\" rel=\"noopener\">📍 Яндекс Карты</a></div>`}"
          new="function mapLinksHTML(p){const n=window.PLACE_NAV&&window.PLACE_NAV[p.i];if(!n)return'';const a=[];if(n.googleUrl)a.push(`<a class=\"btn\" href=\"${n.googleUrl}\" target=\"_blank\" rel=\"noopener\">📍 Google Maps</a>`);if(n.yandexUrl)a.push(`<a class=\"btn\" href=\"${n.yandexUrl}\" target=\"_blank\" rel=\"noopener\">📍 Яндекс Карты</a>`);return a.length?`<div class=\"maplinks\">${a.join('')}</div>`:''}"
          if old not in s:
              raise SystemExit('old mapLinksHTML not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) Responsive layout works with either one or two provider buttons.
          p=Path('app-style.css')
          s=p.read_text()
          old='.maplinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.maplinks .btn{min-height:44px;display:flex;align-items:center;justify-content:center}'
          new='.maplinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.maplinks .btn{min-height:44px;display:flex;align-items:center;justify-content:center}'
          if old not in s:
              raise SystemExit('old maplinks css not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 4) Correct Buddha of Medicine: old value was camera position, not exact object position.
          p=Path('details.js')
          s=p.read_text()
          old_fact="'📍 Координаты по геометке Wikimedia Commons: 51.915252, 102.428859'"
          new_fact="'📍 Координаты самой скульптуры по актуальному путеводителю 2026: 51.915617, 102.429026'"
          if old_fact not in s:
              raise SystemExit('old Buddha coordinate fact not found')
          s=s.replace(old_fact,new_fact,1)
          old_check="check:'Место, расстояние от курорта, ритуал обхода и точные координаты подтверждены официальным сайтом курорта и геометкой лицензированной фотографии Wikimedia Commons.'"
          new_check="check:'Место и расстояние от курорта подтверждены официальным сайтом курорта. Точка самой скульптуры сверена по актуальному путеводителю 2026 и отдельной карточке объекта в Яндекс Картах; GPS фотографии Wikimedia больше не используется как координата объекта.'"
          if old_check not in s:
              raise SystemExit('old Buddha check text not found')
          s=s.replace(old_check,new_check,1)
          p.write_text(s)

          # 5) Cache bust only files changed in this scope.
          p=Path('index.html')
          s=p.read_text()
          repl={
            'app-style.css?build=2233':'app-style.css?build=2234',
            'details.js?build=18':'details.js?build=19',
            'place-nav.js?build=1':'place-nav.js?build=2',
            'place-app.js?build=5':'place-app.js?build=6',
          }
          for a,b in repl.items():
              if a not in s: raise SystemExit(f'index anchor not found: {a}')
              s=s.replace(a,b,1)
          p.write_text(s)

          # QA
          app=Path('place-app.js').read_text()
          nav=Path('place-nav.js').read_text()
          det=Path('details.js').read_text()
          idx=Path('index.html').read_text()
          assert "query=${g}" not in app and "text=${y}" not in app
          assert 'n.googleUrl' in app and 'n.yandexUrl' in app
          assert 'budda_meditsiny/152183331065' in nav
          assert 'sagaan_ubgen/7389356205' in nav
          assert 'railway_station/199004009873' in nav
          assert 'smotrovaya_ploshchadka/45168199333' in nav
          assert '51.915252, 102.428859' not in det
          assert '51.915617, 102.429026' in det
          assert 'place-nav.js?build=2' in idx and 'place-app.js?build=6' in idx and 'details.js?build=19' in idx
          print('Verified map entity links QA OK')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/switch-map-entity-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add place-nav.js place-app.js app-style.css details.js index.html .github/workflows/switch-map-entity-links.yml
          git commit -m 'Use verified map entities instead of coordinate pins'
          git push
