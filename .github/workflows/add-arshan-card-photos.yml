name: Add verified Arshan card photos

on:
  push:
    paths:
      - '.github/workflows/add-arshan-card-photos.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Download and optimize verified photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from io import BytesIO
          from PIL import Image, ImageOps
          import json, time, re

          items = [
            {
              'id':'arshan-15',
              'title':'File:Siberian Solar Radio Telescope.jpg',
              'local':'assets/place-photos/arshan-15-1.jpg',
              'caption':'Радиоастрофизическая обсерватория «Бадары» · IvanT67 · CC0',
              'source':'https://commons.wikimedia.org/wiki/File:Siberian_Solar_Radio_Telescope.jpg'
            },
            {
              'id':'arshan-16',
              'title':'File:Pool (Zhemchug).jpg',
              'local':'assets/place-photos/arshan-16-1.jpg',
              'caption':'Бассейн с минеральной водой, Жемчуг · Аркадий Зарубин · CC BY-SA 3.0',
              'source':'https://commons.wikimedia.org/wiki/File:Pool_(Zhemchug).jpg'
            }
          ]

          def api_info(title):
              params=urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url','iiurlwidth':'900','titles':title,'formatversion':'2'})
              url='https://commons.wikimedia.org/w/api.php?'+params
              req=Request(url,headers={'User-Agent':'Poehali-card-photo/1.0 (github.com/plavnikus/poehali)'})
              with urlopen(req,timeout=60) as r:
                  data=json.load(r)
              info=data['query']['pages'][0]['imageinfo'][0]
              return info['url'], info.get('thumburl') or info['url']

          out=Path('assets/place-photos'); out.mkdir(parents=True,exist_ok=True)
          entries=[]
          for idx,item in enumerate(items):
              if idx: time.sleep(5)
              original,preview=api_info(item['title'])
              time.sleep(3)
              req=Request(preview,headers={'User-Agent':'Poehali-card-photo/1.0 (github.com/plavnikus/poehali)'})
              with urlopen(req,timeout=90) as r: raw=r.read()
              im=ImageOps.exif_transpose(Image.open(BytesIO(raw))).convert('RGB')
              im.thumbnail((900,900),Image.Resampling.LANCZOS)
              target=Path(item['local'])
              im.save(target,'JPEG',quality=82,optimize=True,progressive=True)
              if target.stat().st_size>400*1024:
                  raise RuntimeError(f'{target} too large')
              entries.append((item,original,target.stat().st_size,im.size))

          g=Path('place-gallery.js')
          text=g.read_text(encoding='utf-8')
          if '"arshan-15"' in text or '"arshan-16"' in text:
              raise RuntimeError('Gallery entries already exist')
          block='\nObject.assign(window.GALLERIES,{\n'
          for n,(item,original,size,dims) in enumerate(entries):
              comma=',' if n < len(entries)-1 else ''
              block+=f'  "{item["id"]}":[{{"src":"{original}","thumb":"{item["local"]}","caption":"{item["caption"]}","sourceUrl":"{item["source"]}"}}]{comma}\n'
          block+='});\n'
          g.write_text(text.rstrip()+block,encoding='utf-8')

          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')
          html=re.sub(r'place-gallery\.js\?build=\d+','place-gallery.js?build=6',html,count=1)
          html=re.sub(r'details\.js\?build=\d+','details.js?build=11',html,count=1)
          idx.write_text(html,encoding='utf-8')

          for item,original,size,dims in entries:
              print(item['id'],item['local'],dims,round(size/1024,1),'KB',original)
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('place-gallery.js').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          for p in ['assets/place-photos/arshan-15-1.jpg','assets/place-photos/arshan-16-1.jpg']:
              f=Path(p)
              assert f.exists() and 0 < f.stat().st_size < 400*1024
              assert f'"thumb":"{p}"' in g
          assert 'place-gallery.js?build=6' in i
          assert 'details.js?build=11' in i
          print('verified')
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/add-arshan-card-photos.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/place-photos place-gallery.js index.html .github/workflows/add-arshan-card-photos.yml
          git commit -m 'Add verified photos for Arshan valley cards'
          git push
