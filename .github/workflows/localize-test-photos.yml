name: Localize test photos

on:
  push:
    paths:
      - '.github/workflows/localize-test-photos.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Download and optimize test photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image, ImageOps

          photos = {
              'assets/place-photos/osa-4-1.jpg': 'https://upload.wikimedia.org/wikipedia/commons/f/f6/Vershina_view_AB.jpg',
              'assets/place-photos/osa-4-2.jpg': 'https://upload.wikimedia.org/wikipedia/commons/4/4e/Wierszyna%2C_ko%C5%9Bci%C3%B3%C5%82ek_katolicki_2013.jpg',
              'assets/place-photos/osa-4-3.jpg': 'https://upload.wikimedia.org/wikipedia/commons/c/c9/Ko%C5%9Bci%C3%B3%C5%82_we_wsi_Wierszyna.jpg',
              'assets/place-photos/osa-4-4.jpg': 'https://upload.wikimedia.org/wikipedia/commons/9/91/Wn%C4%99trze_chaty_w_skansenie_we_wsi_Wierszyna.jpg',
              'assets/place-photos/slud-1-1.jpg': 'https://upload.wikimedia.org/wikipedia/commons/5/5e/Slyudyanka_train_station.jpg',
              'assets/place-photos/slud-1-2.jpg': 'https://upload.wikimedia.org/wikipedia/commons/6/62/Slyudyanka_station.jpg',
              'assets/place-photos/slud-1-3.jpg': 'https://upload.wikimedia.org/wikipedia/commons/e/e0/%D0%91%D0%B0%D0%B9%D0%BA%D0%B0%D0%BB._%D0%92%D0%BE%D0%BA%D0%B7%D0%B0%D0%BB_%D1%81%D1%82.%D0%A1%D0%BB%D1%8E%D0%B4%D1%8F%D0%BD%D0%BA%D0%B0_%D1%81_%D0%B3%D1%80%D1%83%D0%BF%D0%BF%D0%BE%D0%B9_%D0%B8%D0%BD%D0%B6%D0%B5%D0%BD%D0%B5%D1%80%D0%BE%D0%B2._%28%D0%B0%D0%BB%D1%8C%D0%B1.%D0%9C%D0%9F%D0%A1._%D0%90%D0%BB%D1%8C%D0%B1%D0%BE%D0%BC%D1%8A_%D0%BF%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%B5%D0%BA%D1%8A_%D0%B8_%D0%B2%D0%B8%D0%B4%D0%BE%D0%B2%D1%8A_%D0%9A%D1%80%D1%83%D0%B3%D0%BE%D0%B1%D0%B0%D0%B9%D0%BA%D0%B0%D0%BB%D1%8C%D1%81%D0%BA%D0%BE%D0%B9_%D0%B6.%D0%B4.1900-1904%D0%B3%29_1901-1904%D0%B3_%D0%93%D0%98%D0%9C_e1.jpg',
          }

          for target, url in photos.items():
              req = Request(url, headers={'User-Agent': 'Poehali-photo-optimizer/1.0'})
              with urlopen(req, timeout=60) as r:
                  data = r.read()
              im = Image.open(BytesIO(data))
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((900, 900), Image.Resampling.LANCZOS)
              out = Path(target)
              out.parent.mkdir(parents=True, exist_ok=True)
              im.save(out, 'JPEG', quality=82, optimize=True, progressive=True)
              size_kb = out.stat().st_size / 1024
              print(f'{target}: {im.width}x{im.height}, {size_kb:.1f} KB')
              if size_kb > 400:
                  raise RuntimeError(f'{target} is too large: {size_kb:.1f} KB')
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/localize-test-photos.yml
      - name: Commit optimized photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/place-photos .github/workflows/localize-test-photos.yml
          git commit -m 'Add optimized local test photos'
          git push
