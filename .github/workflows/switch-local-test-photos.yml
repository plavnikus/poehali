name: Switch local test photos

on:
  push:
    paths:
      - '.github/workflows/switch-local-test-photos.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch gallery thumbnails to local files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('place-gallery.js')
          s = path.read_text(encoding='utf-8')
          replacements = {
            'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Vershina_view_AB.jpg/640px-Vershina_view_AB.jpg': 'assets/place-photos/osa-4-1.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Wierszyna,_ko%C5%9Bci%C3%B3%C5%82ek_katolicki_2013.jpg/640px-Wierszyna,_ko%C5%9Bci%C3%B3%C5%82ek_katolicki_2013.jpg': 'assets/place-photos/osa-4-2.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Ko%C5%9Bci%C3%B3%C5%82_we_wsi_Wierszyna.jpg/640px-Ko%C5%9Bci%C3%B3%C5%82_we_wsi_Wierszyna.jpg': 'assets/place-photos/osa-4-3.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Wn%C4%99trze_chaty_w_skansenie_we_wsi_Wierszyna.jpg/640px-Wn%C4%99trze_chaty_w_skansenie_we_wsi_Wierszyna.jpg': 'assets/place-photos/osa-4-4.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Slyudyanka_train_station.jpg/640px-Slyudyanka_train_station.jpg': 'assets/place-photos/slud-1-1.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Slyudyanka_station.jpg/632px-Slyudyanka_station.jpg': 'assets/place-photos/slud-1-2.jpg',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one match for {old}, got {s.count(old)}')
              s = s.replace(old, new)

          # The third Slyudyanka thumb has a very long Wikimedia URL: replace the thumb field on that exact src record structurally.
          marker = '"src":"https://upload.wikimedia.org/wikipedia/commons/e/e0/%D0%91%D0%B0%D0%B9%D0%BA%D0%B0%D0%BB._%D0%92%D0%BE%D0%BA%D0%B7%D0%B0%D0%BB_%D1%81%D1%82.%D0%A1%D0%BB%D1%8E%D0%B4%D1%8F%D0%BD%D0%BA%D0%B0_'
          start = s.find(marker)
          if start < 0:
              raise RuntimeError('Third Slyudyanka record not found')
          thumb_start = s.find('"thumb":"', start)
          thumb_end = s.find('","caption"', thumb_start)
          if thumb_start < 0 or thumb_end < 0:
              raise RuntimeError('Third Slyudyanka thumb field not found')
          s = s[:thumb_start] + '"thumb":"assets/place-photos/slud-1-3.jpg' + s[thumb_end:]
          path.write_text(s, encoding='utf-8')

          index = Path('index.html')
          t = index.read_text(encoding='utf-8')
          old = 'place-gallery.js?build=3'
          new = 'place-gallery.js?build=4'
          if t.count(old) != 1:
              raise RuntimeError(f'Expected one {old}, got {t.count(old)}')
          index.write_text(t.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/switch-local-test-photos.yml
      - name: Commit switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add place-gallery.js index.html .github/workflows/switch-local-test-photos.yml
          git commit -m 'Use local optimized photos for test cards'
          git push
