name: Localize direction covers
on:
  push:
    paths:
      - '.github/workflows/localize-direction-covers.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download, verify and optimize covers
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError
          from io import BytesIO
          from PIL import Image, ImageOps
          import json, re, html, time

          items = [
            ('ust-orda','Усть-Ордынский - panoramio.jpg','Вячеслав Ребров','CC BY 3.0'),
            ('osa','Vershina view AB.jpg','Andrzej Barabasz (Chepry)','CC BY-SA 3.0'),
            ('tazh','The Tazheran Steppe (29134535545).jpg','Sergio Tittarini','CC BY 2.0'),
            ('arshan','Аршан. Вид на Саяны и пик Любви. 07.2009.jpg','Tohuchar','CC BY 3.0'),
            ('sludyanka','Slyudyanka railway station.jpg','SJabberwocky','CC BY-SA 4.0'),
            ('lena','Река Лена.JPG','Яхин Василий','CC BY-SA 4.0'),
          ]

          def open_retry(req, timeout=90):
              last=None
              for delay in (0,6,12,24,40):
                  if delay: time.sleep(delay)
                  try:
                      return urlopen(req, timeout=timeout)
                  except HTTPError as e:
                      last=e
                      if e.code != 429: raise
              raise last

          outdir=Path('assets/direction-covers'); outdir.mkdir(parents=True,exist_ok=True)
          sources=['# Direction cover photo sources','', 'All local cover files are optimized/cropped derivatives of the Wikimedia Commons originals listed below.']
          paths={}
          for key,filename,expected_artist,expected_license in items:
              params=urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1400','titles':'File:'+filename,'formatversion':'2'})
              req=Request('https://commons.wikimedia.org/w/api.php?'+params,headers={'User-Agent':'Poehali-direction-cover/1.0 (github.com/plavnikus/poehali)'})
              with open_retry(req,60) as r: payload=json.load(r)
              info=payload['query']['pages'][0]['imageinfo'][0]
              meta=info.get('extmetadata',{})
              artist=html.unescape(re.sub('<[^>]+>','',meta.get('Artist',{}).get('value',''))).strip()
              lic=html.unescape(re.sub('<[^>]+>','',meta.get('LicenseShortName',{}).get('value',''))).strip()
              if not lic or not any(x in lic for x in ['CC BY','Attribution','Public domain','CC0']):
                  raise RuntimeError(f'Unexpected license for {filename}: {lic}')
              preq=Request(info.get('thumburl') or info['url'],headers={'User-Agent':'Poehali-direction-cover/1.0 (github.com/plavnikus/poehali)'})
              with open_retry(preq,90) as r: raw=r.read()
              im=Image.open(BytesIO(raw)); im=ImageOps.exif_transpose(im).convert('RGB')
              # Home direction cards render at 16:7; store exactly that ratio to avoid client-side overfetch/cropping surprises.
              im=ImageOps.fit(im,(1200,525),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              out=outdir/(key+'.jpg')
              im.save(out,'JPEG',quality=82,optimize=True,progressive=True)
              if out.stat().st_size > 400*1024: raise RuntimeError(f'Cover too large: {out}')
              page='https://commons.wikimedia.org/wiki/File:'+filename.replace(' ','_')
              sources += ['',f'## {key}',f'- File: `{filename}`',f'- Author: {artist or expected_artist}',f'- License: {lic or expected_license}',f'- Source: {page}',f'- Local derivative: `{out.as_posix()}` (1200×525 JPEG, quality 82)']
              paths[key]=out.as_posix()
              print(key, out.stat().st_size, artist, lic)
              time.sleep(4)

          Path('assets/direction-covers/SOURCES.md').write_text('\n'.join(sources)+'\n',encoding='utf-8')

          p=Path('place-app.js'); s=p.read_text(encoding='utf-8')
          replacements={
            'ust-orda':'https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A3%D1%81%D1%82%D1%8C-%D0%9E%D1%80%D0%B4%D1%8B%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20-%20panoramio.jpg?width=1200',
            'osa':'https://commons.wikimedia.org/wiki/Special:FilePath/Vershina%20view%20AB.jpg?width=1200',
            'tazh':'https://commons.wikimedia.org/wiki/Special:FilePath/Baikal%20Tazheran%20steppe.jpg?width=1200',
            'arshan':'https://commons.wikimedia.org/wiki/Special:FilePath/Arshan%20Buryatia.jpg?width=1200',
            'sludyanka':'https://commons.wikimedia.org/wiki/Special:FilePath/Slyudyanka%20railway%20station.jpg?width=1200',
            'lena':'https://commons.wikimedia.org/wiki/Special:FilePath/Lena%20River%20near%20Kachug.jpg?width=1200'
          }
          for key,old in replacements.items():
              if old not in s: raise RuntimeError('Expected old cover URL missing: '+key)
              s=s.replace(old,paths[key],1)
          p.write_text(s,encoding='utf-8')

          ip=Path('index.html'); idx=ip.read_text(encoding='utf-8')
          if 'place-app.js?build=3' not in idx: raise RuntimeError('Unexpected place-app build')
          idx=idx.replace('place-app.js?build=3','place-app.js?build=4',1)
          ip.write_text(idx,encoding='utf-8')

          # QA: all six local files exist, are exact card ratio, and all six D entries point local.
          final=p.read_text(encoding='utf-8')
          for key in paths:
              fp=Path(paths[key])
              if not fp.exists(): raise RuntimeError('Missing cover '+key)
              with Image.open(fp) as im:
                  if im.size != (1200,525): raise RuntimeError('Bad cover dimensions '+key+': '+str(im.size))
                  im.verify()
              if final.count(paths[key]) != 1: raise RuntimeError('Bad local cover mapping '+key)
          if 'Special:FilePath/' in final.split("const D=",1)[1].split(";let f=",1)[0]:
              raise RuntimeError('Remote direction cover remains')
          print('Direction cover QA OK: 6 local covers')
          PY
      - name: Commit and self-clean
        run: |
          rm .github/workflows/localize-direction-covers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add place-app.js index.html assets/direction-covers .github/workflows/localize-direction-covers.yml
          git commit -m 'Use local optimized direction covers'
          git push
