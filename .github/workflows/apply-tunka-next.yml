name: Apply next Tunka cards
on:
  push:
    paths:
      - '.github/workflows/apply-tunka-next.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: python scripts/apply_tunka_next.py
      - name: Commit card updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data6_arshan.js details.js index.html
          git commit -m 'Update Bukh-Noyon and Kyngarga access cards'
          git push
