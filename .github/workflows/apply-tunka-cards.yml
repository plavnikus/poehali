name: Apply verified Tunka cards
on:
  push:
    paths:
      - '.github/workflows/apply-tunka-cards.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: python scripts/apply_tunka_cards.py
      - name: Commit card data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add details.js data6_arshan.js place-gallery.js index.html
          git commit -m 'Add verified Tunka location cards'
          git push
