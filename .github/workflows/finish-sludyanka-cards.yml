name: Finish Slyudyanka cards
on:
  push:
    paths:
      - '.github/workflows/finish-sludyanka-cards.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Apply verified Slyudyanka cards
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from io import BytesIO
          from PIL import Image, ImageOps
          import json,re,html

          def j(obj): return json.dumps(obj,ensure_ascii=False,separators=(',',':'))
          # Update slud-4..6 in data5 only, preserving every non-Slyudyanka record.
          p5=Path('data5.js'); s=p5.read_text(encoding='utf-8')
          repl={
          'slud-4':{"i":"slud-4","d":"sludyanka","n":"Водонапорная башня и паровоз Л-3504","x":"Краснокирпичная железнодорожная башня начала XX века и паровоз-памятник — компактный индустриально-исторический ансамбль в центре Слюдянки.","c":["history","photo","unusual"],"v":"verified","s":False,"p":"https://www.gorod-sludyanka.ru/page/rubrics-870","u":"https://glagol38.ru/text/18-07-2026/006","t":"Подтверждено","o":"Башня сейчас восстанавливается; внутреннее посещение не обещаем, осматриваем с общедоступной территории."},
          'slud-5':{"i":"slud-5","d":"sludyanka","n":"Свято-Никольская церковь","x":"Исторический храм рядом с железнодорожным центром Слюдянки — спокойная короткая остановка с сильной городской историей.","c":["history","photo","culture"],"v":"verified","s":True,"p":"https://www.gorod-sludyanka.ru/page/rubrics-gorod","u":"https://old.bigenc.ru/geography/text/3872235","t":"Подтверждено","o":"Действующий храм; соблюдаем обычные правила посещения религиозного объекта."},
          'slud-6':{"i":"slud-6","d":"sludyanka","n":"Гора Чапаевка","x":"Скальный останец над Слюдянкой с панорамой города, Култука и южного Байкала; сам объект подтверждён, но короткий безопасный маршрут пока не удалось надёжно зафиксировать.","c":["photo","unusual"],"v":"partial","s":False,"p":"https://ooptirk.ru/monuments/36/","u":"https://irkutsk-gov.ru/doc/107502","t":"Подтверждено как памятник природы; доступ требует проверки","o":"Пока не ставим в готовый семейный маршрут: нет надёжно подтверждённой короткой точки старта и времени прогулки до 2 часов."}
          }
          for key,obj in repl.items():
              pat=r'\{"i":"'+re.escape(key)+r'".*?\}(?=,\{"i":"|\])'
              s,n=re.subn(pat,j(obj),s,count=1,flags=re.S)
              if n!=1: raise RuntimeError('data5 replace failed '+key)
          p5.write_text(s,encoding='utf-8')

          # Rebuild the current extension file with only useful, non-duplicating cards.
          cards=[
          {"i":"slud-7","d":"sludyanka","n":"Культурно-выставочный центр им. Н.К. Рериха — Старая Ангасолка","x":"Небольшой выставочный центр на 149-м км КБЖД с экспозициями о Рерихах и местных художниках — интересный объект, но это уже отдельная поездка по Кругобайкалке.","c":["history","culture"],"v":"verified","s":False,"p":"https://museum-angasolka-baikal.ru/index.php/kontakty","u":"https://museum-angasolka-baikal.ru/index.php/vystavki/dejstvuusie-vystavki","t":"Подтверждено","o":"Не считаем короткой автомобильной остановкой Слюдянки: центр находится в Старой Ангасолке; перед поездкой проверяем транспорт и режим."},
          {"i":"slud-8","d":"sludyanka","n":"Устье Слюдянки и памятный знак водолазам","x":"Короткий выход к Байкалу в месте впадения реки Слюдянки, дополненный локальной историей военной школы водолазов.","c":["photo","history","rest"],"v":"verified","s":False,"p":"https://www.gorod-sludyanka.ru/page/rubrics-870","u":"https://www.gorod-sludyanka.ru/page/rubrics-gorod","t":"Подтверждено","o":"Городская короткая остановка; точное место парковки выбираем на месте по знакам."},
          {"i":"slud-10","d":"sludyanka","n":"Смотровая на Култукском серпантине","x":"Высокий автомобильный вид на южную оконечность Байкала, Култук и железную дорогу — одна из лучших фотопауз направления.","c":["photo","rest"],"v":"verified","s":False,"p":"https://2gis.ru/irkutsk/geo/70030076214178703","u":"https://autotravel.ru/otklik.php/22181","t":"Подтверждено","o":"Координаты 51.73206, 103.711082. Парковка неудобная — останавливаемся только если есть безопасное место вне полосы движения."},
          {"i":"slud-12","d":"sludyanka","n":"Гора Соболиная — летний подъёмник","x":"Кресельный подъёмник даёт высокий вид на Байкал без долгого восхождения; летом 2026 он работает по официальному графику.","c":["photo","rest"],"v":"verified","s":False,"p":"https://baikalski.net/skating/lifts/","u":"https://baikalski.net/razvlecheniya/progulochnyj-bilet/","t":"Подтверждено","o":"Перед выездом проверяем оперативный статус подъёмника и погоду; вторник — профилактические работы."},
          {"i":"slud-13","d":"sludyanka","n":"Променад «Путь воды. Байкальск»","x":"Современная прогулка по Байкальску с историями местных жителей и выходом к берегу — более содержательный вариант, чем просто «набережная».","c":["rest","photo","culture"],"v":"verified","s":False,"p":"https://travel-baikal.info/roads/audiospektakl-promenad-put-vody-bajkalsk/","u":"https://travel-baikal.info/regions/?area=sljudjanskij-rajon","t":"Подтверждено","o":"Лёгкая городская прогулка; конкретную длину можно выбирать по времени."},
          {"i":"slud-14","d":"sludyanka","n":"Гранатовый пляж Байкальска","x":"Узкая полоса берега с красноватым песком из-за примеси альмандина — необычная фототочка на западной окраине Байкальска.","c":["photo","unusual","rest"],"v":"verified","s":False,"p":"https://travel-baikal.info/places/granatovyj-pljazh-pljazh-krasnye-peski/","u":"https://t-j.ru/faq-summer-baikal/","t":"Подтверждено","o":"Красный оттенок заметен не везде; прилегающие дороги неасфальтированы. Минералы с берега не собираем."},
          {"i":"slud-15","d":"sludyanka","n":"Клубника — символ Байкальска","x":"Большая скульптура клубники на берегу — лёгкая и забавная фотопауза, связанная с главным летним символом города.","c":["photo","unusual"],"v":"verified","s":False,"p":"https://travel-baikal.info/places/klubnika-simvol-bajkalska/","u":"https://travel-baikal.info/regions/?area=sljudjanskij-rajon","t":"Подтверждено","o":"Короткая остановка, удобнее объединять с прогулкой по Байкальску."},
          {"i":"slud-16","d":"sludyanka","n":"Тёплые озёра на Снежной","x":"Три лесных озера — Сказка, Изумрудное и Тёплое — отдельный природный блок дня с автомобильным подъездом от Выдрино.","c":["photo","rest","unusual"],"v":"verified","s":False,"p":"https://travel-baikal.info/places/teplye-ozera-na-reke-snezhnaja/","u":"https://travel-baikal.info/regions/?area=sljudjanskij-rajon","t":"Подтверждено","o":"От Выдрино около 9 км по местной дороге; перед поездкой проверяем фактический режим экопарка и состояние последнего участка."},
          {"i":"slud-19","d":"sludyanka","n":"Инклюзивная тропа «Иду на пик»","x":"Деревянный настил вдоль реки Слюдянки, фотозоны, беседки и вид на мраморные горы — короткий вариант Хамар-Дабана без большого похода.","c":["photo","rest"],"v":"verified","s":False,"p":"https://travel-baikal.info/roads/inkljuzivnyj-turmarshrut-idu-na-pik/","u":"https://travel-baikal.info/roads/inkljuzivnyj-turmarshrut-idu-na-pik/","t":"Подтверждено","o":"Старт: ул. 40 лет Октября, координаты 51.640135, 103.697184. Не продолжаем автоматически на многодневный маршрут к пику Черского."}
          ]
          Path('data6_sludyanka.js').write_text('window.P6=(window.P6||[]).concat('+j(cards)+');\n',encoding='utf-8')

          details={
          'slud-4':dict(intro='Краснокирпичная водонапорная башня и паровоз Л-3504 собирают в одном месте историю железнодорожной Слюдянки.',short='Башня, паровоз, гидроколонка и семафор — компактный железнодорожный ансамбль.',why='Это хорошее продолжение мраморного вокзала: здесь видна не парадная, а техническая сторона старой железной дороги. Башню сейчас восстанавливают и готовят к будущему культурному использованию.',facts=['🏭 Башня — объект культурного наследия','🚂 Рядом установлен паровоз Л-3504 с гидроколонкой и семафором','🛠 В 2026 году продолжаются восстановительные работы','🏛 В будущем в башне планируется визит-центр и музей КБЖД'],time='20–35 минут.',walk='Минимальная городская прогулка.',access='Объект находится в центральной части Слюдянки рядом с железнодорожной инфраструктурой и автостанцией.',parking='Используем разрешённые городские места рядом; отдельную музейную парковку не фиксируем.',best='Удобно сразу после вокзала.',photo=['Краснокирпичная башня','Паровоз Л-3504','Гидроколонка и семафор','Общий план железнодорожного ансамбля'],nearby=['slud-1','slud-5','slud-2'],amenities='Центр города и вокзал рядом.',fit='✅ Да. Короткая и необычная историческая остановка.',important='Из-за восстановительных работ внутреннее посещение башни не обещаем; осматриваем с общедоступной территории.',check='Существование ансамбля подтверждено муниципальным сайтом; текущие восстановительные работы — публикациями июля 2026 года.'),
          'slud-5':dict(intro='Свято-Никольская церковь — действующий исторический храм рядом с железнодорожным центром Слюдянки.',short='Небольшой действующий храм с историей, связанной со становлением города и КБЖД.',why='Храм добавляет к железнодорожной истории Слюдянки человеческий и городской слой: церковь появилась вместе с ростом станции и остаётся живым религиозным объектом.',facts=['⛪ Историческая церковь Слюдянки','🗿 Объект находится под государственной охраной','🚶 Удобно совместить с вокзалом и башней'],time='15–30 минут.',walk='Минимальная.',access='Городской подъезд по обычным улицам Слюдянки.',parking='Отдельную официальную парковку не фиксируем.',best='Днём, вне богослужения, если нужен спокойный осмотр.',photo=['Фасад храма','Храм в городской среде','Архитектурные детали'],nearby=['slud-1','slud-4','slud-2'],amenities='Городская инфраструктура рядом.',fit='✅ Да. Короткая культурно-историческая остановка.',important='Это действующий храм: не мешаем службе и соблюдаем правила съёмки внутри.',check='История и охранный статус подтверждены муниципальными и энциклопедическими источниками.'),
          'slud-6':dict(intro='Чапаевка — официальный памятник природы: скальный останец над нижней частью долины Слюдянки с большой панорамой Южного Байкала.',short='Панорамная скала над городом, но короткий семейный подход пока не подтверждён.',why='По виду и расположению место очень подходит проекту, однако здесь важнее не перепутать существование объекта с удобством посещения.',facts=['🪨 Ландшафтный памятник природы','🌊 С вершины видны Слюдянка, Култук и Култукский залив','🌿 На территории есть охраняемые растения'],time='Не фиксируем до проверки конкретного короткого маршрута.',walk='Сам подъём существует, но надёжные параметры семейного варианта до 2 часов подтвердить не удалось.',access='Гора находится в нижнем течении реки Слюдянки. Конкретную точку старта для нашей машины пока не фиксируем.',parking='Не удалось подтвердить.',best='Возвращаемся к точке после получения проверенного короткого трека.',photo=['Скальный останец','Панорама города и Байкала'],nearby=['slud-19','slud-2'],amenities='На самой природной территории инфраструктуру не рассчитываем.',fit='⚠️ Пока не включаем в готовый маршрут. Само место подтверждено, практический семейный подход — нет.',important='Это памятник природы. Не съезжаем с существующих дорог и не повреждаем растительность.',check='Статус, границы и природная ценность подтверждены Дирекцией ООПТ и нормативным актом Иркутской области. Практический короткий маршрут пока не удалось подтвердить.'),
          'slud-7':dict(intro='Культурно-выставочный центр им. Н.К. Рериха находится не в городской Слюдянке, а в Старой Ангасолке на 149-м километре КБЖД.',short='Выставки Рерихов и местных художников — интересная, но отдельная поездка по КБЖД.',why='Центр действительно работает и интересен культурно, но прежняя карточка создавала впечатление, что это простой городской «дождевой резерв». Это не так.',facts=['🎨 Действующий выставочный центр','📍 Адрес: Старая Ангасолка, 5','🚂 До места обычно добираются по КБЖД или через остановку Тёмная Падь','☎️ Центр публикует актуальный контактный телефон'],time='Отдельный маршрут; время зависит от выбранного транспорта.',walk='Не считаем короткой городской прогулкой.',access='Автомобильную поездку прямо к центру в карточке не обещаем. Официальный сайт описывает железнодорожный доступ.',parking='Не применимо к нашему базовому сценарию.',best='Имеет смысл планировать как самостоятельную поездку по КБЖД.',photo=['Выставки центра','Старая Ангасолка и КБЖД'],nearby=['slud-10'],amenities='Условия уточняем у центра перед поездкой.',fit='⚠️ Интересно, но не как остановка нашего обычного автодня по Слюдянке.',important='Перед поездкой проверяем режим и транспорт.',check='Адрес, контакты и актуальные выставки подтверждены официальным сайтом центра.'),
          'slud-8':dict(intro='Устье реки Слюдянки — простой выход к Байкалу, который становится интереснее благодаря памятному знаку военным водолазам.',short='Байкал, устье горной реки и малоизвестная военная история города.',why='В 1942–1944 годах в Слюдянке работала эвакуированная из Севастополя школа военных водолазов, а учебные погружения проходили именно у байкальского берега.',facts=['⚓ Памятный знак связан со школой военных водолазов','🌊 Точка находится у впадения реки Слюдянки в Байкал','📸 Хороший короткий городской выход к воде'],time='20–40 минут.',walk='Лёгкая прогулка по береговой части.',access='Подъезжаем по городским улицам к береговой зоне у устья.',parking='Конкретное место выбираем по знакам; официальную отдельную парковку не фиксируем.',best='В ясную погоду и при спокойном Байкале.',photo=['Устье реки','Памятный знак','Байкал и горы'],nearby=['slud-1','slud-3'],amenities='Городская инфраструктура Слюдянки рядом.',fit='✅ Да. Короткая спокойная остановка с локальной историей.',important='Берег может быть мокрым и скользким; к воде подходим осторожно.',check='Памятный знак и его связь с военной школой водолазов подтверждены официальным муниципальным сайтом.'),
