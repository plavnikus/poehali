name: Run Slyudyanka pass resiliently
on:
  push:
    paths:
      - '.github/workflows/run-sludyanka-retry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Execute prepared pass with retry patch in memory
        run: |
          python - <<'WRAP'
          from pathlib import Path
          import re, textwrap
          wf=Path('.github/workflows/finish-sludyanka-cards.yml').read_text(encoding='utf-8')
          m=re.search(r"          python - <<'PY'\n(.*?)\n          PY",wf,re.S)
          if not m: raise RuntimeError('Prepared Python block not found')
          code=textwrap.dedent(m.group(1))
          code=code.replace('import json,re,html','import json,re,html,time\nfrom urllib.error import HTTPError')
          anchor="def j(obj): return json.dumps(obj,ensure_ascii=False,separators=(',',':'))"
          retry="""def open_retry(req,timeout):
    last=None
    for delay in (0,8,16,32,48):
        if delay: time.sleep(delay)
        try:
            return urlopen(req,timeout=timeout)
        except HTTPError as e:
            last=e
            if e.code != 429: raise
    raise last

"""
          if anchor not in code: raise RuntimeError('Function anchor not found')
          code=code.replace(anchor,retry+anchor,1)
          code=code.replace('urlopen(req,timeout=60)','open_retry(req,60)')
          code=code.replace('urlopen(preq,timeout=90)','open_retry(preq,90)')
          photo_print="print(key,outname,out.stat().st_size,im.size,artist,lic)"
          if photo_print in code:
              code=code.replace(photo_print,photo_print+'\n    time.sleep(5)',1)
          exec(compile(code,'prepared-sludyanka-pass','exec'),{'__name__':'__main__'})
          WRAP
      - name: Commit verified content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data5.js data6_sludyanka.js details.js place-gallery.js index.html assets/place-photos/slud-4-1.jpg assets/place-photos/slud-5-1.jpg assets/place-photos/slud-10-1.jpg
          git commit -m 'Complete Slyudyanka location cards'
          git push
