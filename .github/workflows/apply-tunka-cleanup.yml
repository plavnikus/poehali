name: Apply Tunka card consolidation
on:
  push:
    paths:
      - '.github/workflows/apply-tunka-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: python scripts/apply_tunka_cleanup.py
      - name: Commit card consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data6_arshan.js details.js place-gallery.js index.html
          git commit -m 'Consolidate Tunka location cards'
          git push
