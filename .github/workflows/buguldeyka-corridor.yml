            'check':'Расположение посёлка у устья реки, характер берега и основной автомобильный подъезд подтверждаются несколькими туристическими и картографическими источниками. Конкретную точку парковки у воды лучше выбирать уже на месте по фактической обстановке.'},
          'tazh-21':{
            'intro':'Белый мраморный Буха-Нойон встречает приезжающих в Бугульдейку и смотрит в сторону Байкала, посёлка и священной Мишкиной горы.',
            'short':'Современная скульптура из бугульдейского мрамора и важный образ бурятской традиции.',
