          details={
          'tazh-14':{
            'intro':'Бугульдейка выходит к Байкалу широкой долиной: здесь встречаются прозрачная горная река, галечный берег и почти безлюдная открытая вода.',
            'short':'Берег Байкала, устье реки и широкая долина Бугульдейки.',
