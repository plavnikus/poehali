              time.sleep(2)
              rr=session.get(thumb,timeout=60); rr.raise_for_status()
              im=Image.open(BytesIO(rr.content)); im=ImageOps.exif_transpose(im).convert('RGB'); im.thumbnail((900,900),Image.Resampling.LANCZOS)
              dest=out/local; im.save(dest,'JPEG',quality=82,optimize=True,progressive=True)
              if dest.stat().st_size>400*1024: raise SystemExit(f'{local} too large')
              gallery.append({'src':original,'thumb':'assets/place-photos/'+local,'caption':caption+' · ElenaShugurova · CC BY-SA 4.0','sourceUrl':'https://commons.wikimedia.org/wiki/File:'+title.replace(' ','_')})
          pg=Path('place-gallery.js'); gs=pg.read_text()
          if 'window.GALLERIES["tazh-14"]' in gs or "window.GALLERIES['tazh-14']" in gs: raise SystemExit('tazh-14 gallery assignment already exists')
          gs += '\nwindow.GALLERIES["tazh-14"]='+json.dumps(gallery,ensure_ascii=False,separators=(',',':'))+';\n'
          pg.write_text(gs)
          
          # ---- navigation: only one coordinate we already have independently verified for the daцan ----
          pn=Path('place-nav.js'); ns=pn.read_text()
          if "'tazh-24'" in ns: raise SystemExit('tazh-24 nav already exists')
          anchor='\n};\n'
          if not ns.endswith(anchor): raise SystemExit('Unexpected place-nav ending')
          ns=ns[:-len(anchor)] + ",\n  'tazh-24':{lat:52.790486,lon:104.745721,label:'Усть-Ордынский дацан «Тубдэн Даржелин»',source:'official address + verified cartography'}" + anchor
          pn.write_text(ns)
          
          # ---- cache versions ----
          ip=Path('index.html'); idx=ip.read_text()
          replacements={
            'data6_tazh.js':'data6_tazh.js?build=1',
            'place-gallery.js?build=10':'place-gallery.js?build=11',
            'details.js?build=19':'details.js?build=20',
            'place-nav.js?build=3':'place-nav.js?build=4'}
          for a,b in replacements.items():
              if a not in idx: raise SystemExit('Missing cache anchor '+a)
              idx=idx.replace(a,b,1)
          ip.write_text(idx)
          
          # QA
          d=Path('data6_tazh.js').read_text(); det=Path('details.js').read_text(); nav=Path('place-nav.js').read_text(); gal=Path('place-gallery.js').read_text(); idx=Path('index.html').read_text()
          assert d.count('"i":"tazh-14"')==1 and '"i":"tazh-15"' not in d
          for i in ['tazh-14','tazh-21','tazh-22','tazh-23','tazh-24']:
              assert d.count('"i":"'+i+'"')==1
              assert det.count("window.PLACE_DETAILS['"+i+"']") == 1
          assert 'мраморный карьер не включаем' not in d.lower()
          assert 'tazh-24' in nav
          assert 'buguldeyka-shore-1.jpg' in gal and 'buguldeyka-shore-2.jpg' in gal
          assert 'data6_tazh.js?build=1' in idx and 'place-gallery.js?build=11' in idx and 'details.js?build=20' in idx and 'place-nav.js?build=4' in idx
          for f in ['buguldeyka-shore-1.jpg','buguldeyka-shore-2.jpg']:
              im=Image.open(out/f); im.verify()
          print('Buguldeyka corridor QA OK')
          PY
