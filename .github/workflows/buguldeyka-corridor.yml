            'facts':['🌊 Посёлок стоит там, где река Бугульдейка впадает в Байкал','🪨 Берег в основном галечный и каменистый','🚗 Основной автомобильный путь идёт через Баяндай и Петрово; после асфальта начинается гравийный участок','🌬 Бугульдейку называют «царицей ветров»: на берегу погода может быть ощутимо прохладнее, чем в глубине района'],
