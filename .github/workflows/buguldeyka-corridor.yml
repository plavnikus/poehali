name: Buguldeyka corridor cards
on:
  push:
    paths: ['.github/workflows/buguldeyka-corridor.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cards and photos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, time, requests
          from PIL import Image, ImageOps
          from io import BytesIO
          
          # ---- data6_tazh.js: merge duplicate Buguldeyka shore/mouth, add corridor stops ----
          p=Path('data6_tazh.js')
          s=p.read_text()
          m=re.fullmatch(r'window\.P6=\(window\.P6\|\|\[\]\)\.concat\((\[.*\])\);\s*',s,re.S)
          if not m: raise SystemExit('Unexpected data6_tazh.js format')
          arr=json.loads(m.group(1))
          arr=[x for x in arr if x.get('i') not in {'tazh-14','tazh-15','tazh-21','tazh-22','tazh-23','tazh-24'}]
          arr += [
            {"i":"tazh-14","d":"tazh","n":"Бугульдейка — берег Байкала и устье реки","x":"Широкая галечная береговая линия, прозрачная река и большая открытая панорама Байкала у подножия Приморского хребта.","c":["photo","rest"],"v":"verified","s":False,"p":"https://commons.wikimedia.org/wiki/Category:Buguldeyka","u":"https://www.vpoxod.ru/page/toponym/buguldeyka_info","t":"Подтверждено","o":"После Баяндая часть пути идёт по гравийной дороге. На берегу бывает заметно холоднее и ветренее, чем в глубине района."},
            {"i":"tazh-21","d":"tazh","n":"Буха-Нойон — мраморный бык Бугульдейки","x":"Почти четырёхметровый белый бык из местного мрамора — современная скульптура с глубоким смыслом в бурятской традиции и видом на Байкал.","c":["culture","unusual","photo"],"v":"verified","s":True,"p":"https://www.ogirk.ru/2023/06/27/skulpturu-belogo-byka-otkryli-na-bajkale/","u":"https://www.ogirk.ru/2023/06/27/skulpturu-belogo-byka-otkryli-na-bajkale/","t":"Подтверждено","o":"Скульптура стоит у дороги недалеко от карьера; посещать сам карьер для этой остановки не требуется."},
            {"i":"tazh-22","d":"tazh","n":"Смотровая у вышки над Бугульдейкой","x":"Высокая сопка напротив Мишкиной горы: сверху одновременно видны посёлок, долина реки, устье и огромная акватория Байкала.","c":["photo","rest","unusual"],"v":"partial","s":False,"p":"https://www.vpoxod.ru/page/toponym/buguldeyka_info","u":"https://www.vpoxod.ru/page/toponym/buguldeyka_info","t":"Вероятно","o":"К сопке ведёт дорога в сторону вышки связи, но её актуальное состояние и удобную точку парковки перед подъёмом пока не удалось подтвердить."},
            {"i":"tazh-23","d":"tazh","n":"Баяндаевский этнографический музей","x":"Три усадьбы — бурятская, русская и белорусская — прямо по дороге к Байкалу. Хорошая остановка, чтобы увидеть быт народов района не по витринам, а в воссозданной среде.","c":["culture","history","unusual"],"v":"verified","s":False,"p":"https://www.culture.ru/institutes/90516/bayandaevskii-etnograficheskii-muzei","u":"https://www.culture.ru/institutes/90516/bayandaevskii-etnograficheskii-muzei","t":"Подтверждено","o":"Перед заездом лучше позвонить и подтвердить время экскурсии. Актуальный адрес учреждения: Баяндай, ул. Шоссейная, 1Е."},
            {"i":"tazh-24","d":"tazh","n":"Усть-Ордынский дацан «Тубдэн Даржелин»","x":"Действующий буддийский комплекс с главным храмом, молитвенными барабанами и хуралами — содержательная культурная остановка почти в начале дороги.","c":["culture","photo"],"v":"verified","s":True,"p":"https://dazan-orda.ru/","u":"https://dazan-orda.ru/","t":"Подтверждено","o":"Это действующий храм. Расписание хуралов меняется и публикуется на официальном сайте дацана."}
          ]
          p.write_text('window.P6=(window.P6||[]).concat('+json.dumps(arr,ensure_ascii=False,separators=(',',':'))+');\n')
          
