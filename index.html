<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="theme-color" content="#f5f1e8"><title>Поехали — места вокруг Оёка</title><style>
:root{--b:#f5f1e8;--s:#fffdf8;--i:#171a17;--m:#6e726b;--l:#ded9cf;--a:#234d3d;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:0 15px 92px}header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--b) 80%,transparent);padding:calc(18px + env(safe-area-inset-top)) 2px 14px}.brand{font-size:27px;font-weight:850}.sub{font-size:12px;color:var(--m)}h1{font-size:30px;line-height:1.05;margin:15px 0 7px}.muted{color:var(--m);font-size:14px;line-height:1.45}.dirs,.cards{display:grid;gap:12px}.dir,.card,.detail{background:var(--s);border:1px solid #e6e0d6;border-radius:var(--r);box-shadow:0 8px 24px #1c201c12}.dir{padding:0 0 18px;text-align:left;overflow:hidden}.dircover{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:#ece9e0}.dirbody{padding:0 18px}.dir b{font-size:20px;display:block;margin-top:14px}.dir span{font-size:13px;color:var(--m)}button{font:inherit}.search{width:100%;padding:13px 14px;border:1px solid var(--l);background:var(--s);border-radius:15px;font-size:16px;margin:10px 0}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:11px}.chip{white-space:nowrap;border:1px solid var(--l);background:var(--s);border-radius:999px;padding:8px 10px;font-size:12px}.chip.on{background:var(--a);color:white}.card{padding:15px}.row{display:flex;gap:12px}.ico{width:58px;height:58px;border-radius:16px;background:#ece9e0;display:grid;place-items:center;font-size:26px;flex:none}.card h3{margin:1px 0 7px;font-size:18px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:11px;background:#f0eee8;padding:4px 7px;border-radius:999px}.sac{background:#efe6f5;color:#684777}.desc{font-size:14px;line-height:1.45;color:#4f554f;margin:12px 0}.status{display:inline-block;font-size:12px;font-weight:700;padding:6px 8px;border-radius:10px;background:#eef0ed}.verified{background:#e5f1e8;color:#27633d}.partial{background:#fff0d5;color:#8a5b13}.actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px}.btn{border:1px solid var(--l);background:white;border-radius:13px;padding:10px;text-align:center;text-decoration:none;color:inherit;font-size:13px;font-weight:700}.primary{background:var(--a);color:#fff;border-color:var(--a)}.fav{width:43px;font-size:19px}.fav.on{color:#c34f4c;background:#fff2f1}.back{border:0;background:transparent;color:var(--a);padding:8px 0;font-weight:700}.detail{padding:17px}.detail h2{font-size:26px;line-height:1.05;margin:7px 0 12px}.box{padding:13px;border-radius:15px;background:#fff3dd;margin-top:12px;font-size:14px;line-height:1.45}.sbox{background:#f0e8f6}.links{display:grid;gap:8px;margin-top:16px}nav{position:fixed;bottom:0;left:0;right:0;background:#faf8f2ee;backdrop-filter:blur(16px);border-top:1px solid #ded9cf;padding:7px 12px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{border:0;background:transparent;border-radius:13px;padding:7px;font-size:11px}.nav .on{background:#e9eee9;color:var(--a)}@media(min-width:620px){.dirs,.cards{grid-template-columns:1fr 1fr}}
.gallery{margin:0 0 14px}.cover{width:100%;aspect-ratio:16/10;border-radius:18px;object-fit:cover;background:#ece9e0;display:block}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:8px;padding-bottom:2px}.thumb{width:82px;height:58px;flex:0 0 auto;border:0;padding:0;border-radius:11px;overflow:hidden;background:#ece9e0}.thumb img{width:100%;height:100%;object-fit:cover}.photo-note{font-size:11px;color:var(--m);margin-top:7px}.lightbox{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}.lightbox.on{display:flex}.lbimg{max-width:100vw;max-height:100vh;width:100%;height:100%;object-fit:contain}.lbclose,.lbprev,.lbnext{position:absolute;border:0;background:#0008;color:#fff;z-index:2}.lbclose{right:14px;top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;font-size:24px}.lbprev,.lbnext{top:50%;transform:translateY(-50%);width:44px;height:58px;border-radius:14px;font-size:30px}.lbprev{left:10px}.lbnext{right:10px}.lbcap{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));color:#fff;background:#0009;border-radius:13px;padding:10px 12px;font-size:12px;line-height:1.35}.cardphoto{width:58px;height:58px;border-radius:16px;object-fit:cover;background:#ece9e0;flex:none}
</style></head><body><div class="app"><header><div class="brand">Поехали</div><div class="sub">личная база мест вокруг Оёка</div></header><main id="v"></main></div><div id="lb" class="lightbox" onclick="lbBg(event)"><button class="lbclose" onclick="closeGallery()">×</button><button class="lbprev" onclick="prevPhoto(event)">‹</button><img id="lbimg" class="lbimg" alt=""><button class="lbnext" onclick="nextPhoto(event)">›</button><div id="lbcap" class="lbcap"></div></div><nav><div class="nav"><button id="nh" onclick="home()">🧭<br>Направления</button><button id="na" onclick="allp()">🗺️<br>Все места</button><button id="nf" onclick="favsPage()">❤️<br>Хочу сюда</button></div></nav><script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="gallery.js"></script><script>
const P=[...(window.P1||[]),...(window.P2||[]),...(window.P3||[]),...(window.P4||[])];P.forEach(p=>{if(window.GALLERIES&&window.GALLERIES[p.i])p.g=window.GALLERIES[p.i]});const D={'ust-orda':['Усть-Орда','Усть-Ордынский + ~50 км','🛕','https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A3%D1%81%D1%82%D1%8C-%D0%9E%D1%80%D0%B4%D1%8B%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20-%20panoramio.jpg?width=1200'],'osa':['Александровский тракт → Оса','По пути и окрестности Осы','🌊','https://commons.wikimedia.org/wiki/Special:FilePath/Vershina%20view%20AB.jpg?width=1200']};let f='all',q='';const C={photo:['📸','Красиво'],rest:['🌿','Отдых'],culture:['🛕','Культура'],history:['🗿','История'],food:['🍲','Еда'],unusual:['🏚','Необычное']};function E(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function F(){try{return JSON.parse(localStorage.getItem('pf')||'[]')}catch{return[]}}function SF(x){localStorage.setItem('pf',JSON.stringify(x))}function fav(i,e){if(e)e.stopPropagation();let x=F();x=x.includes(i)?x.filter(z=>z!==i):[...x,i];SF(x);route()}function tag(p){let t=p.c.map(k=>`<span class="tag">${C[k]?.[0]||'📍'} ${C[k]?.[1]||k}</span>`).join('');if(p.s)t+='<span class="tag sac">🟣 Сакральное</span>';return t}function sm(p){return p.v==='verified'?['✅ Проверено','verified']:p.v==='partial'?['🟡 Частично','partial']:['🔎 Разведка','']}function icon(p){for(const k of ['photo','rest','culture','history','food','unusual'])if(p.c.includes(k))return C[k][0];return'📍'}function G(p){return Array.isArray(p.g)?p.g.filter(x=>x&&x.src):[]}let L=[],LI=0;function galleryHTML(p){let g=G(p);if(!g.length)return'';return`<div class="gallery"><img class="cover" src="${g[0].src}" alt="${E(p.n)}" onclick="openGallery('${p.i}',0)">${g.length>1?`<div class="thumbs">${g.map((x,j)=>`<button class="thumb" onclick="openGallery('${p.i}',${j})"><img src="${x.src}" alt="" loading="lazy"></button>`).join('')}</div>`:''}<div class="photo-note">Нажми на фото, чтобы открыть на весь экран${g.length>1?' и листать свайпом':''}.</div></div>`}function openGallery(id,n=0,e){if(e)e.stopPropagation();let p=P.find(x=>x.i===id);if(!p)return;L=G(p);if(!L.length)return;LI=Math.max(0,Math.min(n,L.length-1));showPhoto();lb.classList.add('on');document.body.style.overflow='hidden'}function showPhoto(){let x=L[LI];lbimg.src=x.src;lbcap.innerHTML=`${LI+1} / ${L.length}${x.caption?' · '+E(x.caption):''}${x.sourceUrl?`<br><a href="${x.sourceUrl}" target="_blank" rel="noopener" style="color:white">Источник ↗</a>`:''}`;document.querySelector('.lbprev').style.display=L.length>1?'block':'none';document.querySelector('.lbnext').style.display=L.length>1?'block':'none'}function closeGallery(){lb.classList.remove('on');document.body.style.overflow='';lbimg.src=''}function prevPhoto(e){if(e)e.stopPropagation();if(!L.length)return;LI=(LI-1+L.length)%L.length;showPhoto()}function nextPhoto(e){if(e)e.stopPropagation();if(!L.length)return;LI=(LI+1)%L.length;showPhoto()}function lbBg(e){if(e.target===lb)closeGallery()}let tx=0;addEventListener('touchstart',e=>{if(lb.classList.contains('on'))tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(!lb.classList.contains('on'))return;let dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>45)(dx<0?nextPhoto():prevPhoto())},{passive:true});function card(p){const[s,c]=sm(p),on=F().includes(p.i),g=G(p),lead=g.length?`<img class="cardphoto" src="${g[0].src}" alt="${E(p.n)}" loading="lazy">`:`<div class="ico">${icon(p)}</div>`;return`<article class="card" onclick="place('${p.i}')" style="cursor:pointer"><div class="row">${lead}<div><h3>${E(p.n)}</h3><div class="tags">${tag(p)}</div></div></div><div class="desc">${E(p.x)}</div><span class="status ${c}">${s}</span><div class="actions">${g.length?`<button class="btn" onclick="event.stopPropagation();openGallery('${p.i}',0)">Фото ${g.length>1?'('+g.length+')':''}</button>`:p.p?`<a class="btn" href="${p.p}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Фото у источника ↗</a>`:'<span></span>'}<button class="btn fav ${on?'on':''}" onclick="fav('${p.i}',event)">${on?'♥':'♡'}</button></div></article>`}function chips(){return`<div class="chips">${[['all','Все'],['photo','📸 Красиво'],['rest','🌿 Отдых'],['culture','🛕 Культура'],['history','🗿 История'],['food','🍲 Еда'],['unusual','🏚 Необычное'],['sacred','🟣 Сакральное']].map(x=>`<button class="chip ${f===x[0]?'on':''}" onclick="setf('${x[0]}')">${x[1]}</button>`).join('')}</div>`}function match(p){let a=f==='all'||(f==='sacred'?p.s:p.c.includes(f)),z=(p.n+' '+p.x).toLowerCase();return a&&(!q||z.includes(q.toLowerCase()))}let A=[];function drawResults(){let z=A.filter(match),cards=document.getElementById('cards'),count=document.getElementById('count');if(count)count.textContent=`${z.length} из ${A.length} мест`;if(cards)cards.innerHTML=z.map(card).join('')||'<div class="muted">Ничего не найдено</div>'}function searchInput(el){q=el.value;drawResults()}function list(title,sub,a,back=''){A=a;let z=A.filter(match);v.innerHTML=`${back?`<button class="back" onclick="home()">← Направления</button>`:''}<h1>${title}</h1><div class="muted">${sub} · <span id="count">${z.length} из ${A.length} мест</span></div><input class="search" value="${E(q)}" oninput="searchInput(this)" placeholder="Поиск по местам…">${chips()}<div class="cards" id="cards">${z.map(card).join('')||'<div class="muted">Ничего не найдено</div>'}</div>`}function nav(k){['h','a','f'].forEach(x=>document.getElementById('n'+x).classList.toggle('on',x===k))}function home(){f='all';q='';location.hash='#/'}function allp(){f='all';q='';location.hash='#/all'}function favsPage(){f='all';q='';location.hash='#/fav'}function goDir(d){f='all';q='';location.hash='#/d/'+d}function place(i){location.hash='#/p/'+i}function RH(){nav('h');v.innerHTML=`<h1>Куда поедем?</h1><p class="muted">${P.length} найденных мест. Сначала выбираем понравившееся, потом проверяем и собираем маршрут.</p><div class="dirs">${Object.entries(D).map(([k,d])=>`<button class="dir" onclick="goDir('${k}')"><img class="dircover" src="${d[3]}" alt="" loading="lazy"><div class="dirbody"><div style="font-size:30px;margin-top:14px">${d[2]}</div><b>${d[0]}</b><span>${d[1]} · ${P.filter(p=>p.d===k).length} мест</span></div></button>`).join('')}</div>`}function RP(i){nav('h');let p=P.find(x=>x.i===i);if(!p)return home();let[s,c]=sm(p),on=F().includes(p.i),g=G(p);v.innerHTML=`<button class="back" onclick="goDir('${p.d}')">← ${D[p.d][0]}</button><div class="detail">${galleryHTML(p)}<div style="font-size:38px">${icon(p)}</div><div class="tags">${tag(p)}</div><h2>${E(p.n)}</h2><p class="muted">${E(p.x)}</p><span class="status ${c}">${s}</span>${p.s?'<div class="box sbox"><b>🟣 Сакральное место.</b> Правила посещения и ограничения проверяем отдельно перед поездкой.</div>':''}${p.o?`<div class="box"><b>Важно:</b> ${E(p.o)}</div>`:''}<div class="links"><button class="btn ${on?'':'primary'}" onclick="fav('${p.i}')">${on?'♥ Убрать из «Хочу сюда»':'♡ Хочу сюда'}</button>${!g.length&&p.p?`<a class="btn" href="${p.p}" target="_blank" rel="noopener">📷 Фото у источника ↗</a>`:''}${p.u?`<a class="btn" href="${p.u}" target="_blank" rel="noopener">Источник / описание ↗</a>`:''}</div></div>`}function setf(x){f=x;let h=location.hash||'#/';if(h.startsWith('#/d/')||h==='#/all'||h==='#/fav'){document.querySelectorAll('.chip').forEach((b,i)=>{let keys=['all','photo','rest','culture','history','food','unusual','sacred'];b.classList.toggle('on',keys[i]===f)});drawResults()}else route()}function route(scroll=true){let h=location.hash||'#/';if(h.startsWith('#/d/')){let d=h.split('/')[2];nav('h');list(D[d][0],D[d][1],P.filter(p=>p.d===d),1)}else if(h.startsWith('#/p/'))RP(h.split('/')[2]);else if(h==='#/all'){nav('a');list('Все места','Оба направления',P)}else if(h==='#/fav'){nav('f');let x=F();list('❤️ Хочу сюда','Выбранные места',P.filter(p=>x.includes(p.i)))}else RH();if(scroll)scrollTo(0,0)}addEventListener('hashchange',()=>route());route();
</script></body></html>
