<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="theme-color" content="#f5f1e8"><title>Поехали — места вокруг Оёка</title><style>
:root{--b:#f5f1e8;--s:#fffdf8;--i:#171a17;--m:#6e726b;--l:#ded9cf;--a:#234d3d;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:0 15px 92px}header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--b) 80%,transparent);padding:calc(18px + env(safe-area-inset-top)) 2px 14px}.brand{font-size:27px;font-weight:850}.sub{font-size:12px;color:var(--m)}h1{font-size:30px;line-height:1.05;margin:15px 0 7px}.muted{color:var(--m);font-size:14px;line-height:1.45}.dirs,.cards{display:grid;gap:12px}.dir,.card,.detail{background:var(--s);border:1px solid #e6e0d6;border-radius:var(--r);box-shadow:0 8px 24px #1c201c12}.dir{padding:18px;text-align:left}.dir b{font-size:20px;display:block;margin-top:14px}.dir span{font-size:13px;color:var(--m)}button{font:inherit}.search{width:100%;padding:13px 14px;border:1px solid var(--l);background:var(--s);border-radius:15px;font-size:16px;margin:10px 0}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:11px}.chip{white-space:nowrap;border:1px solid var(--l);background:var(--s);border-radius:999px;padding:8px 10px;font-size:12px}.chip.on{background:var(--a);color:white}.card{padding:15px}.row{display:flex;gap:12px}.ico{width:58px;height:58px;border-radius:16px;background:#ece9e0;display:grid;place-items:center;font-size:26px;flex:none}.card h3{margin:1px 0 7px;font-size:18px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:11px;background:#f0eee8;padding:4px 7px;border-radius:999px}.sac{background:#efe6f5;color:#684777}.desc{font-size:14px;line-height:1.45;color:#4f554f;margin:12px 0}.status{display:inline-block;font-size:12px;font-weight:700;padding:6px 8px;border-radius:10px;background:#eef0ed}.verified{background:#e5f1e8;color:#27633d}.partial{background:#fff0d5;color:#8a5b13}.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:12px}.btn{border:1px solid var(--l);background:white;border-radius:13px;padding:10px;text-align:center;text-decoration:none;color:inherit;font-size:13px;font-weight:700}.primary{background:var(--a);color:#fff;border-color:var(--a)}.fav{width:43px;font-size:19px}.fav.on{color:#c34f4c;background:#fff2f1}.back{border:0;background:transparent;color:var(--a);padding:8px 0;font-weight:700}.detail{padding:17px}.detail h2{font-size:26px;line-height:1.05;margin:7px 0 12px}.box{padding:13px;border-radius:15px;background:#fff3dd;margin-top:12px;font-size:14px;line-height:1.45}.sbox{background:#f0e8f6}.links{display:grid;gap:8px;margin-top:16px}nav{position:fixed;bottom:0;left:0;right:0;background:#faf8f2ee;backdrop-filter:blur(16px);border-top:1px solid #ded9cf;padding:7px 12px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{border:0;background:transparent;border-radius:13px;padding:7px;font-size:11px}.nav .on{background:#e9eee9;color:var(--a)}@media(min-width:620px){.dirs,.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header><div class="brand">Поехали</div><div class="sub">личная база мест вокруг Оёка</div></header><main id="v"></main></div><nav><div class="nav"><button id="nh" onclick="home()">🧭<br>Направления</button><button id="na" onclick="allp()">🗺️<br>Все места</button><button id="nf" onclick="favsPage()">❤️<br>Хочу сюда</button></div></nav><script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script>
const P=[...(window.P1||[]),...(window.P2||[]),...(window.P3||[]),...(window.P4||[])],D={'ust-orda':['Усть-Орда','Усть-Ордынский + ~50 км','🛕'],'osa':['Александровский тракт → Оса','По пути и окрестности Осы','🌊']};let f='all',q='';const C={photo:['📸','Красиво'],rest:['🌿','Отдых'],culture:['🛕','Культура'],history:['🗿','История'],food:['🍲','Еда'],unusual:['🏚','Необычное']};function E(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function F(){try{return JSON.parse(localStorage.getItem('pf')||'[]')}catch{return[]}}function SF(x){localStorage.setItem('pf',JSON.stringify(x))}function fav(i){let x=F();x=x.includes(i)?x.filter(z=>z!==i):[...x,i];SF(x);route()}function tag(p){let t=p.c.map(k=>`<span class="tag">${C[k]?.[0]||'📍'} ${C[k]?.[1]||k}</span>`).join('');if(p.s)t+='<span class="tag sac">🟣 Сакральное</span>';return t}function sm(p){return p.v==='verified'?['✅ Проверено','verified']:p.v==='partial'?['🟡 Частично','partial']:['🔎 Разведка','']}function icon(p){for(const k of ['photo','rest','culture','history','food','unusual'])if(p.c.includes(k))return C[k][0];return'📍'}function card(p){const[s,c]=sm(p),on=F().includes(p.i);return`<article class="card"><div class="row"><div class="ico">${icon(p)}</div><div><h3>${E(p.n)}</h3><div class="tags">${tag(p)}</div></div></div><div class="desc">${E(p.x)}</div><span class="status ${c}">${s}</span><div class="actions"><button class="btn primary" onclick="place('${p.i}')">Открыть</button>${p.p?`<a class="btn" href="${p.p}" target="_blank">Фото ↗</a>`:'<span></span>'}<button class="btn fav ${on?'on':''}" onclick="fav('${p.i}')">${on?'♥':'♡'}</button></div></article>`}function chips(){return`<div class="chips">${[['all','Все'],['photo','📸 Красиво'],['rest','🌿 Отдых'],['culture','🛕 Культура'],['history','🗿 История'],['food','🍲 Еда'],['unusual','🏚 Необычное'],['sacred','🟣 Сакральное']].map(x=>`<button class="chip ${f===x[0]?'on':''}" onclick="setf('${x[0]}')">${x[1]}</button>`).join('')}</div>`}function match(p){let a=f==='all'||(f==='sacred'?p.s:p.c.includes(f)),z=(p.n+' '+p.x).toLowerCase();return a&&(!q||z.includes(q.toLowerCase()))}function list(title,sub,a,back=''){let z=a.filter(match);v.innerHTML=`${back?`<button class="back" onclick="home()">← Направления</button>`:''}<h1>${title}</h1><div class="muted">${sub} · ${z.length} из ${a.length} мест</div><input class="search" value="${E(q)}" oninput="q=this.value;route(false)" placeholder="Поиск по местам…">${chips()}<div class="cards">${z.map(card).join('')||'<div class="muted">Ничего не найдено</div>'}</div>`}function nav(k){['h','a','f'].forEach(x=>document.getElementById('n'+x).classList.toggle('on',x===k))}function home(){f='all';q='';location.hash='#/'}function allp(){f='all';q='';location.hash='#/all'}function favsPage(){f='all';q='';location.hash='#/fav'}function dir(d){f='all';q='';location.hash='#/d/'+d}function place(i){location.hash='#/p/'+i}function RH(){nav('h');v.innerHTML=`<h1>Куда поедем?</h1><p class="muted">${P.length} найденных мест. Сначала выбираем понравившееся, потом проверяем и собираем маршрут.</p><div class="dirs">${Object.entries(D).map(([k,d])=>`<button class="dir" onclick="dir('${k}')"><div style="font-size:30px">${d[2]}</div><b>${d[0]}</b><span>${d[1]} · ${P.filter(p=>p.d===k).length} мест</span></button>`).join('')}</div>`}function RP(i){nav('h');let p=P.find(x=>x.i===i);if(!p)return home();let[s,c]=sm(p),on=F().includes(p.i);v.innerHTML=`<button class="back" onclick="dir('${p.d}')">← ${D[p.d][0]}</button><div class="detail"><div style="font-size:38px">${icon(p)}</div><div class="tags">${tag(p)}</div><h2>${E(p.n)}</h2><p class="muted">${E(p.x)}</p><span class="status ${c}">${s}</span>${p.s?'<div class="box sbox"><b>🟣 Сакральное место.</b> Правила посещения и ограничения проверяем отдельно перед поездкой.</div>':''}${p.o?`<div class="box"><b>Важно:</b> ${E(p.o)}</div>`:''}<div class="links"><button class="btn ${on?'':'primary'}" onclick="fav('${p.i}')">${on?'♥ Убрать из «Хочу сюда»':'♡ Хочу сюда'}</button>${p.p?`<a class="btn" href="${p.p}" target="_blank">📷 Посмотреть фотографии ↗</a>`:''}${p.u?`<a class="btn" href="${p.u}" target="_blank">Источник / описание ↗</a>`:''}</div></div>`}function setf(x){f=x;route()}function route(scroll=true){let h=location.hash||'#/';if(h.startsWith('#/d/')){let d=h.split('/')[2];nav('h');list(D[d][0],D[d][1],P.filter(p=>p.d===d),1)}else if(h.startsWith('#/p/'))RP(h.split('/')[2]);else if(h==='#/all'){nav('a');list('Все места','Оба направления',P)}else if(h==='#/fav'){nav('f');let x=F();list('❤️ Хочу сюда','Выбранные места',P.filter(p=>x.includes(p.i)))}else RH();if(scroll)scrollTo(0,0)}addEventListener('hashchange',()=>route());route();
</script></body></html>
